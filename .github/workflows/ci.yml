name: CI

# release ブランチへの push・PR で、保存層テストと静的チェック（manifest / locale /
# i18n 整合・JS 構文）を実行する。GitHub への送信や公開は行わない。

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Storage unit tests
        run: node test/storage.test.cjs
      - name: Static checks (manifest / locales / i18n)
        run: node test/checks.cjs
      - name: JS syntax check
        run: |
          for f in src/i18n.js src/storage.js src/content.js popup.js; do
            echo "checking $f"
            node --check "$f"
          done
